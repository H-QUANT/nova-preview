<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#050d18" />
  <title>ExplosionOps · NOVA AI Preview</title>
  <style>
    :root{color-scheme:dark;--bg:#050d18;--surface:#0a1727;--line:#193752;--text:#eef8ff;--muted:#8da5bd;--cyan:#19d3c5;--violet:#8f7dff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 22% 16%,rgba(25,211,197,.14),transparent 28%),radial-gradient(circle at 78% 18%,rgba(143,125,255,.16),transparent 28%),var(--bg);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
    main{width:min(440px,calc(100% - 36px));padding:34px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(12,31,51,.96),rgba(7,20,34,.96));box-shadow:0 32px 100px rgba(0,0,0,.45);text-align:center}
    .mark{width:64px;height:64px;margin:0 auto 18px;display:grid;place-items:center;border-radius:20px;background:linear-gradient(135deg,var(--cyan),var(--violet));box-shadow:0 18px 50px rgba(69,128,255,.28)}
    .mark svg{width:38px;height:38px;fill:none;stroke:white;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    h1{margin:0;font-size:27px;letter-spacing:-.03em}p{margin:8px 0 22px;color:var(--muted)}
    .track{height:6px;border-radius:999px;background:#122a40;overflow:hidden}.bar{height:100%;width:34%;border-radius:inherit;background:linear-gradient(90deg,var(--cyan),var(--violet));animation:load 1.25s ease-in-out infinite}
    #status{display:block;margin-top:14px;color:#a9bed2;font-size:12px}.error{color:#ff8597!important}
    @keyframes load{0%{transform:translateX(-120%)}55%{transform:translateX(195%)}100%{transform:translateX(360%)}}
    @media(prefers-reduced-motion:reduce){.bar{animation:none;width:100%}}
  </style>
</head>
<body>
  <main aria-live="polite">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="4"/><path d="M16 3v5M16 24v5M3 16h5M24 16h5M6.8 6.8l3.6 3.6M21.6 21.6l3.6 3.6M25.2 6.8l-3.6 3.6M10.4 21.6l-3.6 3.6"/><circle cx="16" cy="16" r="10" opacity=".45"/></svg>
    </div>
    <h1>ExplosionOps</h1>
    <p>NOVA AI 동료 검토 환경을 준비하고 있습니다.</p>
    <div class="track"><div class="bar"></div></div>
    <small id="status">대시보드 패키지를 불러오는 중...</small>
  </main>
  <script>
    (async () => {
      const status = document.getElementById('status');
      const parts = Array.from({length: 8}, (_, index) => `./payload/app-${String(index).padStart(2, '0')}.txt`);
      try {
        if (!('DecompressionStream' in window)) {
          throw new Error('이 브라우저는 미리보기 압축 해제를 지원하지 않습니다. 최신 Chrome, Edge 또는 Safari에서 열어 주세요.');
        }
        const chunks = [];
        for (let index = 0; index < parts.length; index += 1) {
          status.textContent = `대시보드 패키지 확인 중 ${index + 1}/${parts.length}`;
          const response = await fetch(parts[index], { cache: 'no-store' });
          if (!response.ok) throw new Error(`필수 파일을 불러오지 못했습니다: ${parts[index]} (${response.status})`);
          chunks.push((await response.text()).trim());
        }
        status.textContent = 'NOVA AI 화면을 시작하는 중...';
        const binary = atob(chunks.join(''));
        const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html = await new Response(stream).text();
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);
        status.className = 'error';
        status.textContent = error instanceof Error ? error.message : '미리보기를 시작하지 못했습니다. 잠시 후 새로고침해 주세요.';
      }
    })();
  </script>
</body>
</html>
